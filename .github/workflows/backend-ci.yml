name: Backend CI with docker

on:
  push:
    paths:
      - "Backend-Flask/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  linting-and-testing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-Flask
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "Backend-Flask/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: formatting check
        run: uv run ruff format --check
        continue-on-error: true

      - name: linting check
        run: uv run ruff check
        continue-on-error: true

      - name: run tests
        run: uv run pytest tests/

  docker-push-image:
    needs: linting-and-testing
    if: ${{ needs.linting-and-testing.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: List default context Backend-Flask directory
        run: |
          echo "Listing Backend-Flask directory for debugging using default context:"
          ls -R ${{github.workspace}}/Backend-Flask

      - name: Extract Version Number
        run: |
          VERSION=$(grep -oP '(?<=__version__ = ").*(?=")' ${{github.workspace}}/Backend-Flask/website/__init__.py)
          echo 'VERSION=$VERSION' >> $GITHUB_ENV
          echo 'Extracted version: $VERSION'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: "{{defaultContext}}:Backend-Flask"
          tags: |
            jmartz007/wowmythicgroups:latest
            jmartz007/wowmythicgroups:${{ env.VERSION }}
